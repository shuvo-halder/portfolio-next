name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, TypeCheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy_ci?schema=public"
      SESSION_SECRET: "ci_super_secret_cryptographic_key_minimum_32_characters_long"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "adminpassword123"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Static Lint Verification
        run: pnpm lint

      - name: TypeScript Strict Validation
        run: pnpm exec tsc --noEmit

      - name: Unit Tests
        run: pnpm test

      - name: Production Build
        run: pnpm build
