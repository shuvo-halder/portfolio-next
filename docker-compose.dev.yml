version: "3.8"

# ==============================================================================
# Development Compose Services (PostgreSQL + MinIO S3 Mock)
# Usage: docker compose -f docker-compose.dev.yml up -d
# ==============================================================================

services:
  # Local PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: shuvo-portfolio-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional Local S3-compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: shuvo-portfolio-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

volumes:
  postgres_dev_data:
  minio_dev_data:
