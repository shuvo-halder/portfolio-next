version: "3.8"

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: shuvo-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Next.js App Router Standalone Service
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shuvo-portfolio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=public
      - ADMIN_EMAIL=${ADMIN_EMAIL:-shuvo-halder@outlook.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_secure_password_in_production}
      - SESSION_SECRET=${SESSION_SECRET:-super_secret_cryptographic_key_minimum_32_characters_long}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-shuvo-halder@outlook.com}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-portfolio@shuvohalder.dev}
      - NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Nginx Reverse Proxy & SSL Termination
  nginx:
    image: nginx:alpine
    container_name: shuvo-portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      portfolio:
        condition: service_healthy
    networks:
      - infra-network

networks:
  infra-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot-etc:
  certbot-var:
  certbot-www:
