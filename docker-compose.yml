version: "3.8"

services:
  # Next.js App Router Standalone Service
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shuvo-portfolio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-shuvo-halder@outlook.com}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-portfolio@shuvohalder.dev}
      - NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional Nginx Reverse Proxy & SSL Termination
  nginx:
    image: nginx:alpine
    container_name: shuvo-portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      portfolio:
        condition: service_healthy
    networks:
      - infra-network

networks:
  infra-network:
    driver: bridge

volumes:
  certbot-etc:
  certbot-var:
  certbot-www:
