# ==============================================================================
# Production Nginx Reverse Proxy Configuration for Next.js App Router
# Features: HTTP/2, Let's Encrypt / Certbot TLS, Gzip, Immutable Caching, Security Headers
# ==============================================================================

upstream nextjs_upstream {
    server portfolio:3000;
    keepalive 64;
}

# 1. HTTP Server - Redirects to HTTPS & serves ACME challenges
server {
    listen 80;
    listen [::]:80;
    server_name shuvohalder.dev www.shuvohalder.dev;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Primary Application Ingress
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shuvohalder.dev www.shuvohalder.dev;

    # SSL Certificates (Configure with certbot-smart-manager or standard certbot)
    ssl_certificate /etc/letsencrypt/live/shuvohalder.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuvohalder.dev/privkey.pem;

    # SSL Hardening Configuration (A+ Rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Immutable Caching for Next.js Static Chunks
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static assets caching (favicons, fonts, images)
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # Primary Proxy Pass to Standalone App
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Healthcheck bypass
    location = /api/health {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        access_log off;
    }
}
